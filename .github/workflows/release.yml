name: release
# A tag vX.Y.Z publishes the package: check, build the window, npm publish with dist/ inside, and the same tarball on a GitHub Release.
# The whose-turn plugin in BladeForge installs the published package, so the user never builds. ADR 0007.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Trusted publishing needs npm 11.5 or newer; Node 22 ships npm 10
        run: npm install -g npm@latest && npm --version
      - name: The tag names the package version
        run: |
          tag=${GITHUB_REF_NAME#v}
          version=$(node -p "require('./package.json').version")
          [ "$tag" = "$version" ] || { echo "tag v$tag, package.json $version: they must match"; exit 1; }
      - run: npm run check
      - run: npm run build
      - name: Pack
        run: npm pack && ls -l whose-turn-*.tgz && tar tzf whose-turn-*.tgz | grep -c '^package/dist/' | xargs -I{} echo "{} files under dist/"
      - name: Publish to npm
        # No token: npm trusts this workflow through OIDC (the package's trusted publisher, RMA-235), and `id-token: write` above is what lets it. Every publish moves `latest`, prereleases included, because every install follows it (RMA-230, RMA-231); a prerelease also gets its channel tag (`alpha`).
        run: |
          version=${GITHUB_REF_NAME#v}
          npm publish whose-turn-*.tgz --provenance --access public --tag latest
          case "$version" in *-*) channel=${version#*-}; npm dist-tag add "whose-turn@$version" "${channel%%.*}";; esac
      - name: GitHub Release with the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease;; *) pre=;; esac
          gh release create "$GITHUB_REF_NAME" whose-turn-*.tgz --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." $pre
