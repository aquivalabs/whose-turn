name: release
# A tag vX.Y.Z publishes the package: check, build the window, npm publish with dist/ inside, and the same tarball on a GitHub Release.
# The marketplace entry (BladeForge) installs the published package, so the user never builds. ADR 0007.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: The tag names the package version
        run: |
          tag=${GITHUB_REF_NAME#v}
          version=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./.claude-plugin/plugin.json').version")
          [ "$tag" = "$version" ] && [ "$tag" = "$plugin" ] || { echo "tag v$tag, package.json $version, plugin.json $plugin: they must match"; exit 1; }
      - run: npm run check
      - run: npm run build
      - name: Pack
        run: npm pack && ls -l whose-turn-*.tgz && tar tzf whose-turn-*.tgz | grep -c '^package/dist/' | xargs -I{} echo "{} files under dist/"
      - name: Publish to npm
        # A prerelease (1.0.0-alpha.1) goes to the dist-tag `alpha`, a release to `latest`; the marketplace entry follows one of them.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) tag=alpha;; *) tag=latest;; esac
          npm publish whose-turn-*.tgz --provenance --access public --tag "$tag"
      - name: GitHub Release with the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease;; *) pre=;; esac
          gh release create "$GITHUB_REF_NAME" whose-turn-*.tgz --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." $pre
